<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 350px; min-height: 500px; padding: 25px; font-family: 'Helvetica Neue', sans-serif; background: #fff; color: #000; }
    h2 { border-bottom: 5px solid #000; padding-bottom: 10px; text-transform: uppercase; font-weight: 900; letter-spacing: -1px; }
    .screen { display: none; flex-direction: column; }
    .screen.active { display: flex; }
    .main-btn { background: #000; color: #fff; border: none; padding: 20px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
    .main-btn:hover { background: #333; }
    #chart-container { margin: 20px 0; height: 250px; }
    
    /* 履歴エリアのスタイル */
    #history-area { margin-top: 30px; border-top: 2px solid #000; padding-top: 15px; }
    .history-title { font-size: 11px; font-weight: 900; letter-spacing: 1px; margin-bottom: 15px; }
    .history-item { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .history-img { width: 45px; height: 45px; object-fit: cover; border: 1px solid #000; }
    .history-info { flex: 1; }
    .history-name { font-size: 12px; font-weight: bold; text-transform: uppercase; }
    .history-soul { font-size: 10px; color: #666; line-height: 1.2; }
  </style>
</head>
<body>
  <h2>Sensibility Matcher</h2>
  <div class="screen active" id="main-screen">
    <div id="chart-container"><canvas id="currentChart"></canvas></div>
    <button class="main-btn" id="start-analysis-btn">深層診断を開始する</button>
    
    <div id="history-area">
      <div class="history-title">RECENT INFLUENCES</div>
      <div id="history-list"></div>
    </div>
  </div>

  <div id="quiz-area"></div>

  <div class="screen" id="result-screen">
    <div id="brand-name" style="font-size: 24px; font-weight: 900; margin: 20px 0;"></div>
    <div id="brand-desc" style="font-size: 13px; line-height: 1.6; margin-bottom: 20px;"></div>
    <button class="main-btn" id="close-btn">完了</button>
  </div>

  <script src="chart.js"></script>
  <script src="popup.js"></script>
</body>
</html>
